<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>leads · pi</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="/tokens.css" />
<style>
  /* Hallmark · macrostructure: app-shell (chat cockpit) · tone: atmospheric / late-night · anchor hue: cyan 202
   * pre-emit critique: P5 H4 E5 S5 R5 V4
   * theme: custom "late-night cockpit" · paper oklch(15.5% .012 245) · accent oklch(82% .13 202) cool · Space Grotesk + Inter + JetBrains Mono
   */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: clip; }

  body {
    background: var(--color-bg);
    color: var(--color-txt);
    font: var(--text-md)/1.55 var(--font-ui);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
  }
  /* one soft atmospheric bloom, top-left — the only radial in the build */
  body::before {
    content: "";
    position: fixed;
    top: -18vh; left: -10vw;
    width: 60vw; height: 60vh;
    background: radial-gradient(closest-side, var(--color-accent-glow), transparent 72%);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }
  aside, main { position: relative; z-index: 1; }

  /* ---- sidebar ---- */
  aside {
    width: 216px; flex-shrink: 0;
    background: var(--color-side);
    border-right: 1px solid var(--color-line-soft);
    display: flex; flex-direction: column;
    padding: var(--space-md) var(--space-sm);
    gap: var(--space-2xs);
  }
  aside .brand {
    display: flex; align-items: center; gap: var(--space-sm);
    font-family: var(--font-display);
    font-weight: 600; font-size: var(--text-sm); letter-spacing: 0.14em;
    color: var(--color-dim); text-transform: uppercase;
    padding: var(--space-2xs) var(--space-sm) var(--space-md);
  }
  aside .brand::before {
    content: ""; width: 9px; height: 9px; flex-shrink: 0;
    border-radius: 2px;
    background: var(--color-accent);
    box-shadow: 0 0 10px var(--color-accent-glow);
  }

  #projlist {
    display: flex; flex-direction: column; gap: 2px;
    flex: 1; overflow-y: auto; min-height: 0;
  }
  .proj {
    display: flex; align-items: center; gap: var(--space-sm);
    width: 100%; text-align: left;
    background: none; border: 1px solid transparent;
    color: var(--color-dim); font: inherit; font-size: var(--text-base); cursor: pointer;
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md);
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out);
  }
  .proj:hover { background: var(--color-raised); color: var(--color-txt); }
  .proj:active { transform: translateY(0.5px); }
  .proj.active {
    background: var(--color-raised); color: var(--color-txt);
    box-shadow: inset 2px 0 0 var(--color-accent);
  }
  .proj:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: -1px;
  }
  .proj .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj .busy {
    width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%;
    background: var(--color-accent);
    box-shadow: 0 0 8px var(--color-accent-glow);
    animation: pulse 1.4s var(--ease-in-out) infinite;
  }

  .add {
    margin-top: var(--space-sm); flex-shrink: 0;
    background: none; border: 1px dashed var(--color-line);
    color: var(--color-faint); font: inherit; font-size: var(--text-base);
    padding: var(--space-sm); border-radius: var(--radius-md); cursor: pointer;
    transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .add:hover { color: var(--color-txt); border-color: var(--color-dim); }
  .add:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* ---- main ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--color-line-soft);
    display: flex; align-items: center; gap: var(--space-md);
    background: color-mix(in oklch, var(--color-panel) 82%, transparent);
    backdrop-filter: blur(8px);
  }
  header .dot {
    width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%;
    background: var(--color-faint);
    transition: background var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
  }
  header .dot.on { background: var(--color-accent); box-shadow: 0 0 9px var(--color-accent-glow); }
  header b {
    font-family: var(--font-display);
    font-weight: 600; font-size: var(--text-lg); letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  header .dir {
    color: var(--color-faint); font-family: var(--font-mono); font-size: var(--text-xs);
    margin-left: auto; padding-left: var(--space-md);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #logs { flex: 1; overflow: hidden; position: relative; }
  .log {
    position: absolute; inset: 0; overflow-y: auto;
    padding: var(--space-xl) var(--space-lg);
    display: none; flex-direction: column; gap: var(--space-md);
    scrollbar-width: thin;
    scrollbar-color: var(--color-line) transparent;
  }
  .log.active { display: flex; }

  .msg {
    max-width: 74%;
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-lg);
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
    font-size: var(--text-base); line-height: 1.55;
    animation: msg-in var(--dur-med) var(--ease-out) both;
  }
  .msg.me {
    align-self: flex-end;
    background: var(--color-me); color: var(--color-txt);
    border-bottom-right-radius: var(--radius-sm);
  }
  .msg.lead {
    align-self: flex-start;
    background: var(--color-raised); color: var(--color-txt);
    border: 1px solid var(--color-line-soft);
    border-left: 2px solid var(--color-accent-dim);
    border-bottom-left-radius: var(--radius-sm);
  }

  .status {
    align-self: flex-start;
    display: flex; align-items: center; gap: var(--space-sm);
    color: var(--color-dim); font-family: var(--font-mono);
    font-size: var(--text-xs); font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em; padding: 2px var(--space-2xs);
  }
  .status .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--color-accent);
    box-shadow: 0 0 8px var(--color-accent-glow);
    animation: pulse 1.4s var(--ease-in-out) infinite;
  }
  .status.done { color: var(--color-faint); }
  .status.done .pulse { animation: none; background: var(--color-line); box-shadow: none; }

  .empty { margin: auto; color: var(--color-faint); font-size: var(--text-base); }

  footer {
    border-top: 1px solid var(--color-line-soft);
    padding: var(--space-md) var(--space-lg);
    background: color-mix(in oklch, var(--color-panel) 82%, transparent);
    backdrop-filter: blur(8px);
  }
  footer form { display: flex; gap: var(--space-md); align-items: flex-end; }
  textarea {
    flex: 1; resize: none;
    background: var(--color-bg); color: var(--color-txt);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    font: var(--text-base)/1.5 var(--font-ui);
    max-height: 140px;
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  textarea::placeholder { color: var(--color-faint); }
  textarea:focus {
    outline: none;
    border-color: var(--color-accent-dim);
    box-shadow: 0 0 0 3px var(--color-accent-glow);
  }

  button.send {
    background: var(--color-accent); color: var(--color-accent-ink);
    border: 0; border-radius: var(--radius-md);
    padding: 0 var(--space-lg); min-height: 38px;
    font: inherit; font-weight: 600; font-size: var(--text-base);
    letter-spacing: 0.01em; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-out),
                opacity var(--dur-fast) var(--ease-out);
  }
  button.send:hover { background: color-mix(in oklch, var(--color-accent) 86%, white); }
  button.send:active { transform: translateY(1px); }
  button.send:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  button.send:disabled { opacity: 0.4; cursor: default; background: var(--color-accent-dim); }

  /* stop/cancel — only shown while the active lead's turn is in flight */
  button.stop {
    background: transparent; color: var(--color-danger);
    border: 1px solid color-mix(in oklch, var(--color-danger) 40%, var(--color-line));
    border-radius: var(--radius-md);
    padding: 0 var(--space-lg); min-height: 38px;
    font: inherit; font-weight: 600; font-size: var(--text-base);
    letter-spacing: 0.01em; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  button.stop:hover { background: color-mix(in oklch, var(--color-danger) 14%, transparent); }
  button.stop:active { transform: translateY(1px); }
  button.stop:focus-visible { outline: 2px solid var(--color-danger); outline-offset: 2px; }
  button.stop[hidden] { display: none; }

  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- sidebar footer: settings + add ---- */
  .aside-foot {
    margin-top: var(--space-sm);
    display: flex; align-items: center; gap: var(--space-xs);
  }
  .aside-foot .add { flex: 1; margin-top: 0; }
  .icon-btn {
    background: none; border: 1px solid transparent; color: var(--color-dim);
    cursor: pointer; width: 38px; height: 38px; flex-shrink: 0;
    border-radius: var(--radius-md); display: grid; place-items: center;
    font-size: 17px; line-height: 1;
    transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .icon-btn:hover { color: var(--color-txt); background: var(--color-raised); }
  .icon-btn:active { transform: translateY(0.5px); }
  .icon-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  /* ---- dialog / modal ---- */
  dialog.modal {
    margin: auto; padding: 0; border: 1px solid var(--color-line);
    background: var(--color-panel); color: var(--color-txt);
    border-radius: var(--radius-lg);
    width: min(440px, calc(100vw - 2 * var(--space-lg)));
    box-shadow: 0 24px 64px oklch(0% 0 0 / 0.55);
  }
  dialog.modal::backdrop {
    background: oklch(8% 0.01 245 / 0.62);
    backdrop-filter: blur(3px);
  }
  .modal-card { display: flex; flex-direction: column; max-height: calc(100dvh - 2 * var(--space-lg)); }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-lg) var(--space-lg) var(--space-md);
    border-bottom: 1px solid var(--color-line-soft);
  }
  .modal-head h2 {
    margin: 0; font-family: var(--font-display); font-weight: 600;
    font-size: var(--text-lg); letter-spacing: -0.01em;
  }
  .modal-head .count { color: var(--color-faint); font-weight: 400; font-size: var(--text-sm); }
  .x {
    background: none; border: 0; color: var(--color-dim); cursor: pointer;
    width: 30px; height: 30px; border-radius: var(--radius-sm);
    display: grid; place-items: center; font-size: 14px;
    transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .x:hover { color: var(--color-txt); background: var(--color-raised); }
  .x:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .modal-body {
    padding: var(--space-lg); overflow-y: auto;
    display: flex; flex-direction: column; gap: var(--space-xl);
  }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg) var(--space-lg);
    border-top: 1px solid var(--color-line-soft);
  }

  /* ---- buttons (shared) ---- */
  .btn {
    font: inherit; font-size: var(--text-base); font-weight: 600;
    border-radius: var(--radius-md); padding: 0 var(--space-lg); min-height: 38px;
    cursor: pointer; border: 1px solid transparent; letter-spacing: 0.01em;
    transition: background var(--dur-fast) var(--ease-out),
                color var(--dur-fast) var(--ease-out),
                border-color var(--dur-fast) var(--ease-out),
                transform var(--dur-fast) var(--ease-out);
  }
  .btn.primary { background: var(--color-accent); color: var(--color-accent-ink); }
  .btn.primary:hover { background: color-mix(in oklch, var(--color-accent) 86%, white); }
  .btn.ghost { background: transparent; color: var(--color-dim); border-color: var(--color-line); }
  .btn.ghost:hover { color: var(--color-txt); border-color: var(--color-dim); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  /* ---- form fields ---- */
  .field { display: flex; flex-direction: column; gap: var(--space-2xs); }
  .field-label { font-size: var(--text-sm); color: var(--color-dim); }
  .field-label em { font-style: normal; color: var(--color-faint); font-size: var(--text-xs); }
  .field-input {
    background: var(--color-bg); color: var(--color-txt);
    border: 1px solid var(--color-line); border-radius: var(--radius-md);
    padding: var(--space-sm) var(--space-md);
    font: var(--text-base)/1.4 var(--font-ui); width: 100%;
    transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  .field-input.mono { font-family: var(--font-mono); }
  .field-input::placeholder { color: var(--color-faint); }
  .field-input:focus {
    outline: none; border-color: var(--color-accent-dim);
    box-shadow: 0 0 0 3px var(--color-accent-glow);
  }
  .field-error { margin: 0; color: var(--color-danger); font-size: var(--text-sm); }
  select.field-input { cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--color-dim) 50%),
                      linear-gradient(135deg, var(--color-dim) 50%, transparent 50%);
    background-position: right 15px center, right 10px center;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    padding-right: var(--space-xl); }
  select.field-input:disabled { opacity: 0.5; cursor: default; }
  .set-note { margin: 0; font-size: var(--text-xs); }
  .set-note.ok { color: var(--color-dim); }
  .set-note.err { color: var(--color-danger); }

  /* ---- settings groups ---- */
  .set-group { display: flex; flex-direction: column; gap: var(--space-sm); }
  .set-title {
    margin: 0; font-family: var(--font-mono); font-weight: 600;
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--color-faint);
  }
  .kv { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-md); }
  .kv span { color: var(--color-dim); font-size: var(--text-base); }
  .kv code { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-txt); }

  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-md); cursor: pointer;
  }
  .switch-row > span { display: flex; flex-direction: column; gap: 2px; font-size: var(--text-base); }
  .switch-row small { color: var(--color-faint); font-size: var(--text-xs); }
  .switch {
    appearance: none; -webkit-appearance: none; margin: 0;
    width: 40px; height: 24px; flex-shrink: 0; border-radius: 999px;
    background: var(--color-line); position: relative; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-out);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--color-dim);
    transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .switch:checked { background: var(--color-accent); }
  .switch:checked::after { transform: translateX(16px); background: var(--color-accent-ink); }
  .switch:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .repo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2xs); }
  .repo-list li {
    display: flex; flex-direction: column; gap: 1px;
    padding: var(--space-xs) var(--space-sm);
    border-radius: var(--radius-sm); background: var(--color-bg);
  }
  .repo-list .rl-name { font-size: var(--text-base); }
  .repo-list .rl-dir {
    font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* manual reduce-motion (settings toggle) */
  :root[data-reduce-motion] .msg { animation: none; }
  :root[data-reduce-motion] .busy,
  :root[data-reduce-motion] .status .pulse { animation: none; }
  :root[data-reduce-motion] .proj,
  :root[data-reduce-motion] .add,
  :root[data-reduce-motion] .icon-btn,
  :root[data-reduce-motion] .btn,
  :root[data-reduce-motion] textarea,
  :root[data-reduce-motion] button.send { transition-duration: 1ms; }

  /* ---- mobile: sidebar folds to a top repo rail ---- */
  @media (max-width: 640px) {
    body { height: 100dvh; flex-direction: column; }

    /* sidebar → sticky top bar; brand mark + scrollable chips + icon add */
    aside {
      width: 100%; flex-direction: row; align-items: center;
      border-right: 0; border-bottom: 1px solid var(--color-line-soft);
      gap: var(--space-sm);
      padding: max(var(--space-xs), env(safe-area-inset-top))
               max(var(--space-md), env(safe-area-inset-right))
               var(--space-xs)
               max(var(--space-md), env(safe-area-inset-left));
      background: color-mix(in oklch, var(--color-side) 88%, transparent);
      backdrop-filter: blur(8px);
    }
    /* wordmark → mark only (reclaim horizontal space); mark keeps its fixed size */
    aside .brand { padding: 0; font-size: 0; letter-spacing: 0; flex-shrink: 0; }

    /* repos → snapping, scrollbar-free chip rail with a right-edge fade */
    #projlist {
      flex-direction: row; flex: 1; min-width: 0;
      overflow-y: visible; overflow-x: auto;
      gap: var(--space-xs);
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 20px), transparent);
              mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 20px), transparent);
    }
    #projlist::-webkit-scrollbar { display: none; }
    .proj {
      width: auto; flex-shrink: 0; scroll-snap-align: start;
      min-height: 38px; padding: var(--space-xs) var(--space-md);
      background: var(--color-raised); color: var(--color-dim);
      border-color: var(--color-line-soft);
    }
    .proj.active {
      color: var(--color-txt);
      background: color-mix(in oklch, var(--color-raised) 84%, var(--color-accent));
      box-shadow: inset 0 0 0 1px var(--color-accent);
    }
    .proj .name { max-width: 34vw; }

    /* settings + add → compact icon buttons, pinned right */
    .aside-foot { margin: 0 0 0 auto; flex-shrink: 0; gap: var(--space-xs); }
    .aside-foot .add { flex: 0 0 auto; }
    .add {
      margin: 0; flex-shrink: 0;
      width: 38px; height: 38px; padding: 0; font-size: 0;
      display: grid; place-items: center;
    }
    .add::before { content: "＋"; font-size: 20px; line-height: 1; }

    /* header — tighter, with notch-safe insets */
    header {
      padding: var(--space-sm)
               max(var(--space-md), env(safe-area-inset-right))
               var(--space-sm)
               max(var(--space-md), env(safe-area-inset-left));
    }

    /* chat */
    .msg { max-width: 86%; }
    .log {
      padding: var(--space-lg) max(var(--space-md), env(safe-area-inset-right))
               var(--space-lg) max(var(--space-md), env(safe-area-inset-left));
      gap: var(--space-sm);
    }

    /* composer — 16px kills iOS focus-zoom · bigger tap targets · home-bar inset */
    footer {
      padding: var(--space-sm)
               max(var(--space-md), env(safe-area-inset-right))
               max(var(--space-sm), env(safe-area-inset-bottom))
               max(var(--space-md), env(safe-area-inset-left));
    }
    textarea { font-size: 16px; }
    button.send, button.stop { min-height: 44px; padding: 0 var(--space-md); }
  }

  /* ---- inspector drawer (harness state) ---- */
  .inspector {
    position: fixed; top: 0; right: 0; z-index: 20;
    width: min(384px, 100vw); height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--color-panel);
    border-left: 1px solid var(--color-line);
    box-shadow: -24px 0 64px oklch(0% 0 0 / 0.45);
    transform: translateX(100%);
    transition: transform var(--dur-med) var(--ease-out);
  }
  .inspector.open { transform: translateX(0); }
  :root[data-reduce-motion] .inspector { transition-duration: 1ms; }
  .insp-back {
    position: fixed; inset: 0; z-index: 19;
    background: oklch(8% 0.01 245 / 0.4); backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none; transition: opacity var(--dur-med) var(--ease-out);
  }
  .insp-back.open { opacity: 1; pointer-events: auto; }

  .insp-head {
    display: flex; align-items: center; gap: var(--space-sm);
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--color-line-soft); flex-shrink: 0;
  }
  .insp-head h2 {
    margin: 0; flex: 1; font-family: var(--font-display); font-weight: 600;
    font-size: var(--text-lg); letter-spacing: -0.01em;
  }
  .insp-live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--color-line);
  }
  .insp-live-dot.on {
    background: var(--color-accent); box-shadow: 0 0 8px var(--color-accent-glow);
    animation: pulse 1.4s var(--ease-in-out) infinite;
  }
  :root[data-reduce-motion] .insp-live-dot.on { animation: none; }

  .insp-body {
    flex: 1; overflow-y: auto; min-height: 0;
    padding: var(--space-lg);
    display: flex; flex-direction: column; gap: var(--space-xl);
    scrollbar-width: thin; scrollbar-color: var(--color-line) transparent;
  }
  .insp-sec { display: flex; flex-direction: column; gap: var(--space-sm); }
  .insp-sec > h3 {
    margin: 0; font-family: var(--font-mono); font-weight: 600;
    font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--color-faint);
  }
  .insp-sec > h3 .n { color: var(--color-dim); }

  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
  .chip {
    display: inline-flex; align-items: baseline; gap: var(--space-2xs);
    padding: 3px var(--space-sm); border-radius: var(--radius-sm);
    background: var(--color-bg); border: 1px solid var(--color-line-soft);
    font-family: var(--font-mono); font-size: var(--text-xs);
  }
  .chip b { color: var(--color-faint); font-weight: 500; letter-spacing: 0.04em; }
  .chip span { color: var(--color-txt); }

  details.tool {
    background: var(--color-bg); border: 1px solid var(--color-line-soft);
    border-radius: var(--radius-md); overflow: hidden;
  }
  details.tool + details.tool { margin-top: var(--space-2xs); }
  details.tool > summary {
    display: flex; align-items: center; gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md); cursor: pointer; list-style: none;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool > summary::before {
    content: "▸"; color: var(--color-faint); font-size: var(--text-xs);
    transition: transform var(--dur-fast) var(--ease-out);
  }
  details.tool[open] > summary::before { transform: rotate(90deg); }
  details.tool:hover { border-color: var(--color-line); }
  .tname { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--color-txt); flex: 1; }
  .src {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--color-faint); border: 1px solid var(--color-line-soft);
    border-radius: 999px; padding: 1px 7px;
  }
  .src.custom, .src.extension { color: var(--color-accent); border-color: var(--color-accent-dim); }
  .tbody { padding: 0 var(--space-md) var(--space-md); display: flex; flex-direction: column; gap: var(--space-xs); }
  .tdesc { margin: 0; color: var(--color-dim); font-size: var(--text-xs); line-height: 1.5; }
  .prms { display: flex; flex-direction: column; gap: 3px; }
  .prm {
    display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: var(--space-xs);
    font-size: var(--text-xs);
  }
  .prm > code { font-family: var(--font-mono); color: var(--color-txt); }
  .prm-t { font-family: var(--font-mono); color: var(--color-accent-dim); font-size: 10px; }
  .prm-d { color: var(--color-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prm-none, .tl-none, .sub-none { color: var(--color-faint); font-size: var(--text-xs); font-style: italic; }

  pre.sysprompt {
    margin: 0; max-height: 168px; overflow: auto;
    background: var(--color-bg); border: 1px solid var(--color-line-soft);
    border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md);
    font-family: var(--font-mono); font-size: 11px; line-height: 1.55; color: var(--color-dim);
    white-space: pre-wrap; word-break: break-word;
    scrollbar-width: thin; scrollbar-color: var(--color-line) transparent;
  }

  .live-stats { display: flex; flex-wrap: wrap; gap: var(--space-2xs); }
  .toollog { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--color-line) transparent; }
  .tl {
    display: grid; grid-template-columns: 44px 1fr; align-items: baseline; gap: var(--space-sm);
    font-family: var(--font-mono); font-size: var(--text-xs); padding: 1px 0;
  }
  .tl .tl-t { color: var(--color-faint); font-variant-numeric: tabular-nums; text-align: right; }
  .tl code { color: var(--color-txt); }
  .tl.agent code { color: var(--color-accent); }
  .tl.agent::after { content: "subagent"; color: var(--color-accent-dim); font-size: 10px; }

  .sub {
    background: var(--color-bg); border: 1px solid var(--color-line-soft);
    border-left: 2px solid var(--color-accent-dim);
    border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md);
  }
  .sub + .sub { margin-top: var(--space-2xs); }
  .sub-top { display: flex; align-items: center; gap: var(--space-sm); }
  .sub-dot { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: var(--color-line); }
  .sub.running .sub-dot { background: var(--color-accent); box-shadow: 0 0 8px var(--color-accent-glow);
    animation: pulse 1.4s var(--ease-in-out) infinite; }
  :root[data-reduce-motion] .sub.running .sub-dot { animation: none; }
  .sub.error { border-left-color: var(--color-danger); }
  .sub.error .sub-dot { background: var(--color-danger); }
  .sub-task { flex: 1; font-size: var(--text-xs); color: var(--color-txt); line-height: 1.45;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub-t { flex-shrink: 0; font-family: var(--font-mono); font-size: 10px; color: var(--color-faint);
    font-variant-numeric: tabular-nums; }
  .sub-res {
    margin-top: var(--space-xs); max-height: 108px; overflow-y: auto;
    font-size: 11px; line-height: 1.5; color: var(--color-dim); white-space: pre-wrap; word-break: break-word;
    padding-top: var(--space-xs); border-top: 1px solid var(--color-line-soft);
    scrollbar-width: thin; scrollbar-color: var(--color-line) transparent;
  }

  @media (max-width: 640px) {
    .inspector { width: 100vw; }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation: none; }
    .proj, .add, textarea, button.send, header .dot { transition-duration: 1ms; }
    .busy, .status .pulse { animation: none; }
    .inspector, .insp-back { transition-duration: 1ms; }
  }
</style>
</head>
<body>
  <aside>
    <div class="brand">leads</div>
    <div id="projlist"></div>
    <div class="aside-foot">
      <button class="icon-btn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">⚙</button>
      <button class="add" id="addBtn" type="button">＋ Add repo</button>
    </div>
  </aside>
  <main>
    <header>
      <span class="dot" id="conn"></span>
      <b id="activeName">—</b>
      <span class="dir" id="activeDir"></span>
      <button class="icon-btn" id="inspectBtn" type="button" title="Harness inspector" aria-label="Harness inspector">◫</button>
      <a class="icon-btn" id="harnessBtn" href="/harness.html" title="Harness Control" aria-label="Harness Control" style="text-decoration:none">⎈</a>
    </header>
    <div id="logs"></div>
    <footer>
      <form id="f">
        <textarea id="in" rows="1" placeholder="Message the lead…" autofocus></textarea>
        <button class="stop" id="stop" type="button" hidden>Stop</button>
        <button class="send" id="send" type="submit">Send</button>
      </form>
    </footer>
  </main>

  <!-- add-repo modal -->
  <dialog class="modal" id="repoModal">
    <form class="modal-card" id="repoForm">
      <div class="modal-head">
        <h2>Add a repo</h2>
        <button type="button" class="x" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Repo path</span>
          <input class="field-input mono" id="repoDir" placeholder="~/Dev/my-app" autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field-label">Display name <em>— optional</em></span>
          <input class="field-input" id="repoName" placeholder="my-app" autocomplete="off" />
        </label>
        <p class="field-error" id="repoError" hidden></p>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost" data-close>Cancel</button>
        <button type="submit" class="btn primary" id="repoSubmit">Add repo</button>
      </div>
    </form>
  </dialog>

  <!-- settings modal -->
  <dialog class="modal" id="settingsModal">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button type="button" class="x" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <section class="set-group">
          <h3 class="set-title">Model</h3>
          <label class="field">
            <span class="field-label">Model <em>— provider in parens</em></span>
            <select class="field-input mono" id="cfgModel"><option>—</option></select>
          </label>
          <label class="field">
            <span class="field-label">Thinking</span>
            <select class="field-input mono" id="cfgThinking"></select>
          </label>
          <p class="set-note" id="cfgNote" hidden></p>
        </section>
        <section class="set-group">
          <h3 class="set-title">Preferences</h3>
          <label class="switch-row">
            <span>Enter to send<small>Off → Enter makes a newline; ⌘/Ctrl+Enter sends</small></span>
            <input type="checkbox" class="switch" id="prefEnter" />
          </label>
          <label class="switch-row">
            <span>Reduce motion<small>Minimise animations</small></span>
            <input type="checkbox" class="switch" id="prefMotion" />
          </label>
        </section>
        <section class="set-group">
          <h3 class="set-title">Repos <span class="count" id="repoCount"></span></h3>
          <ul class="repo-list" id="settingsRepos"></ul>
        </section>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn primary" data-close>Done</button>
      </div>
    </div>
  </dialog>

<!-- harness inspector drawer -->
  <div class="insp-back" id="inspBack"></div>
  <aside class="inspector" id="inspector" aria-hidden="true">
    <div class="insp-head">
      <span class="insp-live-dot" id="inspLive"></span>
      <h2>Inspector</h2>
      <button type="button" class="x" id="inspClose" aria-label="Close">✕</button>
    </div>
    <div class="insp-body" id="inspBody">
      <section class="insp-sec">
        <h3>Harness</h3>
        <div class="chips" id="inspHarness"></div>
      </section>
      <section class="insp-sec">
        <h3>Tools <span class="n" id="inspToolCount"></span></h3>
        <div id="inspTools"></div>
      </section>
      <section class="insp-sec">
        <h3>Live <span class="n" id="inspLiveName"></span></h3>
        <div class="live-stats" id="inspStats"></div>
        <div class="toollog" id="inspToolLog"></div>
      </section>
      <section class="insp-sec">
        <h3>Subagents <span class="n" id="inspSubCount"></span></h3>
        <div id="inspSubs"></div>
      </section>
      <section class="insp-sec">
        <h3>System prompt</h3>
        <pre class="sysprompt" id="inspPrompt"></pre>
      </section>
    </div>
  </aside>

<script type="module">
  import { createClient, PROTOCOL_VERSION, OUT } from "/protocol/browser.mjs";

  const logsWrap = document.getElementById("logs");
  const projList = document.getElementById("projlist");
  const input = document.getElementById("in");
  const form = document.getElementById("f");
  const sendBtn = document.getElementById("send");
  const stopBtn = document.getElementById("stop");
  const conn = document.getElementById("conn");
  const activeName = document.getElementById("activeName");
  const activeDir = document.getElementById("activeDir");

  let client;                        // shared @pi/protocol client (owns the socket)
  let socketOpen = false;
  let projects = [];
  let active = null;                 // active project id
  const P = new Map();               // id -> per-project state

  const isAgentTool = (n) => /subagent|agent|spawn|delegate|^task$/i.test(n || "");
  const fmtTok = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(n));
  const fmtElapsed = (ms) => {
    const s = Math.round(ms / 1000);
    return s < 60 ? s + "s" : Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0");
  };

  function stateFor(id) {
    if (P.has(id)) return P.get(id);
    const logEl = document.createElement("div");
    logEl.className = "log";
    logsWrap.appendChild(logEl);
    const st = { id, logEl, leadBubble: null, statusEl: null, statusTimer: null,
                 steps: 0, agents: 0, tokens: 0, startedAt: 0, busy: false, toolLog: [], subs: [] };
    P.set(id, st);
    return st;
  }
  function bubble(st, cls, text) {
    const d = document.createElement("div");
    d.className = cls;
    if (text != null) d.textContent = text;
    st.logEl.appendChild(d);
    st.logEl.scrollTop = st.logEl.scrollHeight;
    return d;
  }

  // Composer reflects the active lead's turn state: Send disabled + Stop shown
  // while its turn is in flight (between `typing` and `done`/`error`).
  function syncComposer() {
    const st = active ? P.get(active) : null;
    const busy = !!(st && st.busy);
    sendBtn.disabled = busy;
    stopBtn.hidden = !busy;
  }
  stopBtn.onclick = () => { if (active) client.sendAbort(active); };

  // ---- status line (per project) ----
  function renderStatus(st) {
    if (!st.statusEl) return;
    const parts = [];
    if (st.steps > 0) parts.push(`${st.steps} step${st.steps === 1 ? "" : "s"}`);
    if (st.agents > 0) parts.push(`${st.agents} agent${st.agents === 1 ? "" : "s"}`);
    parts.push(fmtElapsed(Date.now() - st.startedAt));
    if (st.tokens > 0) parts.push(`${fmtTok(st.tokens)} tok`);
    st.statusEl.querySelector(".label").textContent = parts.length === 1 ? `waiting · ${parts[0]}` : parts.join(" · ");
    syncInspector(st);
  }
  function startStatus(st) {
    st.steps = 0; st.agents = 0; st.tokens = 0; st.startedAt = Date.now();
    st.statusEl = document.createElement("div");
    st.statusEl.className = "status";
    st.statusEl.innerHTML = '<span class="pulse"></span><span class="label"></span>';
    st.logEl.appendChild(st.statusEl);
    renderStatus(st);
    st.statusTimer = setInterval(() => renderStatus(st), 500);
    st.logEl.scrollTop = st.logEl.scrollHeight;
  }
  function finishStatus(st) {
    if (st.statusTimer) { clearInterval(st.statusTimer); st.statusTimer = null; }
    if (st.statusEl) { renderStatus(st); st.statusEl.classList.add("done"); st.statusEl = null; }
  }

  // ---- sidebar ----
  function renderSidebar() {
    projList.innerHTML = "";
    for (const p of projects) {
      const b = document.createElement("button");
      b.className = "proj" + (p.id === active ? " active" : "");
      b.innerHTML = `<span class="name"></span>`;
      b.querySelector(".name").textContent = p.name;
      if (P.get(p.id)?.busy) {
        const dot = document.createElement("span"); dot.className = "busy"; b.appendChild(dot);
      }
      b.onclick = () => selectProject(p.id);
      projList.appendChild(b);
    }
  }
  function selectProject(id) {
    active = id;
    const p = projects.find((x) => x.id === id);
    const st = stateFor(id);
    for (const s of P.values()) s.logEl.classList.toggle("active", s.id === id);
    activeName.textContent = p ? p.name : "—";
    activeDir.textContent = p ? p.dir : "";
    syncComposer();
    renderSidebar();
    if (inspectorOpen) refreshInspector();
    input.focus();
  }

  async function loadProjects(selectId) {
    projects = await (await fetch("/projects")).json();
    if (!active && projects.length) active = selectId || projects[0].id;
    for (const p of projects) stateFor(p.id);
    renderSidebar();
    if (active) selectProject(active);
  }

  // ---- preferences (localStorage) ----
  const prefs = {
    enterToSend: localStorage.getItem("pi-lead.enterToSend") !== "0",
    reduceMotion: localStorage.getItem("pi-lead.reduceMotion") === "1",
  };
  function applyPrefs() {
    document.documentElement.toggleAttribute("data-reduce-motion", prefs.reduceMotion);
  }
  applyPrefs();

  // ---- modals (native <dialog>) ----
  for (const el of document.querySelectorAll("[data-close]")) {
    el.addEventListener("click", () => el.closest("dialog").close());
  }

  // add-repo
  const repoModal = document.getElementById("repoModal");
  const repoForm = document.getElementById("repoForm");
  const repoDir = document.getElementById("repoDir");
  const repoName = document.getElementById("repoName");
  const repoError = document.getElementById("repoError");
  const repoSubmit = document.getElementById("repoSubmit");

  document.getElementById("addBtn").onclick = () => {
    repoForm.reset();
    repoError.hidden = true; repoError.textContent = "";
    repoSubmit.disabled = false; repoSubmit.textContent = "Add repo";
    repoModal.showModal();
    repoDir.focus();
  };

  repoForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const dir = repoDir.value.trim();
    if (!dir) { repoDir.focus(); return; }
    repoError.hidden = true;
    repoSubmit.disabled = true; repoSubmit.textContent = "Adding…";
    try {
      const res = await fetch("/projects", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ dir, name: repoName.value.trim() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      projects = data.list;
      stateFor(data.project.id);
      repoModal.close();
      selectProject(data.project.id);
    } catch (err) {
      repoError.textContent = err.message || String(err);
      repoError.hidden = false;
      repoSubmit.disabled = false; repoSubmit.textContent = "Add repo";
    }
  });

  // settings
  const settingsModal = document.getElementById("settingsModal");
  const prefEnter = document.getElementById("prefEnter");
  const prefMotion = document.getElementById("prefMotion");
  const settingsRepos = document.getElementById("settingsRepos");
  const repoCount = document.getElementById("repoCount");
  const cfgModel = document.getElementById("cfgModel");
  const cfgThinking = document.getElementById("cfgThinking");
  const cfgNote = document.getElementById("cfgNote");

  const setNote = (text, kind) => {
    cfgNote.hidden = !text;
    cfgNote.textContent = text || "";
    cfgNote.className = "set-note" + (kind ? " " + kind : "");
  };

  // Push a harness-config change to the server; leads respawn with it.
  async function saveConfig(patch) {
    cfgModel.disabled = cfgThinking.disabled = true;
    setNote("Saving…", "ok");
    try {
      const res = await fetch("/config", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify(patch),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      setNote("Saved · applies to the next message per repo.", "ok");
    } catch (err) {
      setNote(err.message || String(err), "err");
    } finally {
      cfgModel.disabled = cfgThinking.disabled = false;
    }
  }

  cfgModel.addEventListener("change", () => {
    const opt = cfgModel.selectedOptions[0];
    if (!opt || !opt.dataset.id) return;
    saveConfig({ provider: opt.dataset.provider, model: opt.dataset.id });
  });
  cfgThinking.addEventListener("change", () => saveConfig({ thinking: cfgThinking.value }));

  prefEnter.addEventListener("change", () => {
    prefs.enterToSend = prefEnter.checked;
    localStorage.setItem("pi-lead.enterToSend", prefEnter.checked ? "1" : "0");
  });
  prefMotion.addEventListener("change", () => {
    prefs.reduceMotion = prefMotion.checked;
    localStorage.setItem("pi-lead.reduceMotion", prefMotion.checked ? "1" : "0");
    applyPrefs();
  });

  document.getElementById("settingsBtn").onclick = async () => {
    prefEnter.checked = prefs.enterToSend;
    prefMotion.checked = prefs.reduceMotion;
    repoCount.textContent = projects.length ? "· " + projects.length : "";
    settingsRepos.innerHTML = "";
    for (const p of projects) {
      const li = document.createElement("li");
      const n = document.createElement("div"); n.className = "rl-name"; n.textContent = p.name;
      const d = document.createElement("div"); d.className = "rl-dir"; d.textContent = p.dir;
      li.append(n, d); settingsRepos.appendChild(li);
    }
    settingsModal.showModal();
    setNote("", null);
    cfgModel.disabled = cfgThinking.disabled = true;
    try {
      const cfg = await (await fetch("/config")).json();

      // thinking levels
      cfgThinking.innerHTML = "";
      for (const lvl of (cfg.thinkingLevels || [cfg.thinking])) {
        const o = document.createElement("option");
        o.value = lvl; o.textContent = lvl;
        o.selected = lvl === cfg.thinking;
        cfgThinking.appendChild(o);
      }

      // available models — value carries both provider + id
      cfgModel.innerHTML = "";
      const models = cfg.models || [];
      if (!models.length) {
        // no auth-listed models: at least show the current one so it isn't blank
        const o = document.createElement("option");
        o.dataset.id = cfg.model; o.dataset.provider = cfg.provider;
        o.textContent = `${cfg.model} (${cfg.provider})`; o.selected = true;
        cfgModel.appendChild(o);
      }
      for (const m of models) {
        const o = document.createElement("option");
        o.dataset.id = m.id; o.dataset.provider = m.provider || cfg.provider;
        o.textContent = `${m.name || m.id}${m.provider ? ` (${m.provider})` : ""}`;
        o.selected = m.id === cfg.model && (m.provider || cfg.provider) === cfg.provider;
        cfgModel.appendChild(o);
      }
      cfgModel.disabled = cfgThinking.disabled = false;
    } catch {
      setNote("Couldn't load config from server.", "err");
    }
  };

  // ---- inspector (harness state) ----
  const inspector = document.getElementById("inspector");
  const inspBack = document.getElementById("inspBack");
  const inspHarness = document.getElementById("inspHarness");
  const inspTools = document.getElementById("inspTools");
  const inspToolCount = document.getElementById("inspToolCount");
  const inspPrompt = document.getElementById("inspPrompt");
  const inspStats = document.getElementById("inspStats");
  const inspToolLog = document.getElementById("inspToolLog");
  const inspLiveName = document.getElementById("inspLiveName");
  const inspLive = document.getElementById("inspLive");
  const inspSubs = document.getElementById("inspSubs");
  const inspSubCount = document.getElementById("inspSubCount");
  let inspectorOpen = false;

  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const chip = (k, v) => `<span class="chip"><b>${esc(k)}</b><span>${esc(v)}</span></span>`;
  const schemaType = (v) => v?.type || (Array.isArray(v?.anyOf) ? v.anyOf.map((x) => x.type).filter(Boolean).join("|") : "") || "any";

  function renderParams(schema) {
    const props = schema && schema.properties;
    if (!props || !Object.keys(props).length) return '<span class="prm-none">no parameters</span>';
    const req = new Set(schema.required || []);
    return Object.entries(props).map(([k, v]) =>
      `<div class="prm"><code>${esc(k)}${req.has(k) ? "" : "?"}</code>` +
      `<span class="prm-t">${esc(schemaType(v))}</span>` +
      `<span class="prm-d">${esc(v.description || "")}</span></div>`
    ).join("");
  }

  function renderManifest(m) {
    inspHarness.innerHTML =
      chip("model", m.model) + chip("provider", m.provider) + chip("thinking", m.thinking) +
      chip("tools", (m.tools || []).length);
    const tools = m.tools || [];
    inspToolCount.textContent = tools.length ? `· ${tools.length}` : "";
    inspTools.innerHTML = tools.map((t) =>
      `<details class="tool"><summary>` +
        `<code class="tname">${esc(t.name)}</code>` +
        `<span class="src ${esc(t.source)}">${esc(t.source || "builtin")}</span>` +
      `</summary><div class="tbody">` +
        (t.description ? `<p class="tdesc">${esc(t.description)}</p>` : "") +
        `<div class="prms">${renderParams(t.schema)}</div>` +
      `</div></details>`
    ).join("");
    inspPrompt.textContent = m.systemPrompt || "(none)";
  }

  function fmtAt(st, at) {
    if (st.startedAt && at >= st.startedAt) return "+" + Math.round((at - st.startedAt) / 1000) + "s";
    const d = new Date(at);
    return String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0");
  }
  function renderLive(st) {
    if (!st) { inspStats.innerHTML = ""; inspToolLog.innerHTML = ""; inspSubs.innerHTML = ""; return; }
    inspLive.classList.toggle("on", !!st.busy);
    const stats = [chip("status", st.busy ? "working" : "idle"), chip("steps", st.steps)];
    if (st.tokens > 0) stats.push(chip("tokens", fmtTok(st.tokens)));
    if (st.startedAt) stats.push(chip("elapsed", fmtElapsed(Date.now() - st.startedAt)));
    inspStats.innerHTML = stats.join("");

    const log = st.toolLog.slice(-60);
    const mark = (e) => e.ok == null
      ? '' // still running — no marker
      : e.ok
        ? ' <span style="color:var(--color-accent)">✓</span>'
        : ' <span style="color:var(--color-danger)">✗</span>';
    inspToolLog.innerHTML = log.length
      ? log.map((e) => `<div class="tl ${e.agent ? "agent" : ""}"><span class="tl-t">${fmtAt(st, e.at)}</span><code>${esc(e.tool)}${mark(e)}</code></div>`).join("")
      : '<span class="tl-none">no tool calls yet</span>';
    inspToolLog.scrollTop = inspToolLog.scrollHeight;

    inspSubCount.textContent = st.subs.length ? `· ${st.subs.length}` : "";
    inspSubs.innerHTML = st.subs.length
      ? st.subs.slice().reverse().map((s) =>
          `<div class="sub ${esc(s.status)}"><div class="sub-top">` +
            `<span class="sub-dot"></span><span class="sub-task">${esc(s.task)}</span>` +
            `<span class="sub-t">${fmtAt(st, s.at)}</span></div>` +
            (s.result ? `<div class="sub-res">${esc(s.result)}</div>` : "") +
          `</div>`
        ).join("")
      : '<span class="sub-none">none yet — the lead delegates here when a dig is heavy</span>';
  }
  // Live re-render, throttled by event cadence; called from renderStatus + ws events.
  function syncInspector(st) {
    if (!inspectorOpen || !st || st.id !== active) return;
    renderLive(st);
  }

  async function refreshInspector() {
    if (!active) return;
    inspLiveName.textContent = "";
    const p = projects.find((x) => x.id === active);
    if (p) inspLiveName.textContent = `· ${p.name}`;
    renderLive(stateFor(active));
    try {
      const m = await (await fetch("/manifest?project=" + encodeURIComponent(active))).json();
      renderManifest(m);
    } catch {
      inspTools.innerHTML = '<span class="prm-none">couldn\'t load manifest</span>';
    }
  }
  function openInspector() {
    inspectorOpen = true;
    inspector.classList.add("open"); inspBack.classList.add("open");
    inspector.setAttribute("aria-hidden", "false");
    refreshInspector();
  }
  function closeInspector() {
    inspectorOpen = false;
    inspector.classList.remove("open"); inspBack.classList.remove("open");
    inspector.setAttribute("aria-hidden", "true");
  }
  document.getElementById("inspectBtn").onclick = () => (inspectorOpen ? closeInspector() : openInspector());
  document.getElementById("inspClose").onclick = closeInspector;
  inspBack.onclick = closeInspector;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && inspectorOpen) closeInspector(); });

  // ---- websocket (transport via the shared @pi/protocol client) ----
  // Typed per-type handlers keyed off OUT.* constants — no event-type literals.
  client = createClient({
    url: `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`,
    WebSocket: window.WebSocket,
    onOpen: () => { socketOpen = true; conn.classList.add("on"); },
    onClose: () => { socketOpen = false; conn.classList.remove("on"); },
    // Surface a protocol mismatch visibly: flip the connection dot to an error
    // state (red + hover title) so a stale client is obvious, not just logged.
    onVersionMismatch: ({ client, server }) => {
      conn.classList.remove("on");
      conn.style.background = "var(--color-danger)";
      conn.style.boxShadow = "0 0 9px var(--color-danger)";
      conn.title = `harness protocol v${server} — refresh (client v${client})`;
    },
  });

  // hello has no `project`; every other frame filters into its project slice and
  // re-syncs the inspector. One typed handler per OUT.* event type.
  client.on(OUT.HELLO, (m) => { projects = m.projects || []; loadProjects(); });
  const onFrame = (type, fn) => client.on(type, (m) => {
    if (!m.project) return;
    const st = stateFor(m.project);
    fn(m, st);
    syncInspector(st);
  });

  onFrame(OUT.TYPING, (m, st) => {
    st.busy = true; startStatus(st);
    if (m.project === active) syncComposer();
    renderSidebar();
  });
  onFrame(OUT.STEP, (m, st) => {
    const agent = isAgentTool(m.tool);
    if (agent) st.agents++; else st.steps++;
    // track the running tool by id so tool_end can pair + mark it
    st.toolLog.push({ tool: m.tool || "?", at: Date.now(), agent, id: m.toolCallId, ok: null });
    if (st.toolLog.length > 200) st.toolLog.shift();
    renderStatus(st);
  });
  onFrame(OUT.TOOL_END, (m, st) => {
    // pair by toolCallId; fall back to the most recent still-running step
    let e = m.toolCallId && st.toolLog.find((x) => x.id === m.toolCallId);
    if (!e) for (let i = st.toolLog.length - 1; i >= 0; i--) { if (st.toolLog[i].ok == null) { e = st.toolLog[i]; break; } }
    if (e) e.ok = !!m.ok;
    renderStatus(st);
  });
  onFrame(OUT.USAGE, (m, st) => {
    st.tokens += (m.input || 0) + (m.output || 0);
    renderStatus(st);
  });
  onFrame(OUT.SUBAGENT, (m, st) => {
    if (m.phase === "start") {
      st.subs.push({ id: m.id, task: m.task || "", status: "running", result: "", at: Date.now() });
      if (st.subs.length > 12) st.subs.shift();
    } else {
      const s = st.subs.find((x) => x.id === m.id);
      if (s) { s.status = m.ok ? "done" : "error"; s.result = m.result || ""; }
    }
  });
  onFrame(OUT.DELTA, (m, st) => {
    if (!st.leadBubble) st.leadBubble = bubble(st, "msg lead", "");
    st.leadBubble.textContent += m.text;
    st.logEl.scrollTop = st.logEl.scrollHeight;
  });
  onFrame(OUT.DONE, (m, st) => {
    finishStatus(st); st.leadBubble = null; st.busy = false;
    if (m.project === active) syncComposer();
    renderSidebar();
  });
  onFrame(OUT.ERROR, (m, st) => {
    finishStatus(st); st.leadBubble = null; st.busy = false;
    bubble(st, "msg lead", "⚠️ " + m.text);
    if (m.project === active) syncComposer();
    renderSidebar();
  });

  function submit() {
    const text = input.value.trim();
    if (!text || !active || !socketOpen) return;
    const st = stateFor(active);
    if (st.busy) return;
    bubble(st, "msg me", text);
    st.leadBubble = null;
    client.sendUser(active, text);
    input.value = ""; input.style.height = "auto";
    sendBtn.disabled = true;
  }
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const cmd = e.metaKey || e.ctrlKey;
    if (prefs.enterToSend ? (!e.shiftKey && !cmd) : cmd) { e.preventDefault(); submit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
</script>
</body>
</html>
